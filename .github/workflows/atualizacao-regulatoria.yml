name: Atualização Regulatória Diária do Oráculo

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-oraculo:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Registrar início da verificação
        run: |
          echo "Verificação regulatória iniciada em $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Rotina: execução diária."

      - name: Verificar estrutura da base
        run: |
          test -f data.json
          test -f update_manifest.json
          echo "Estrutura da base validada."

      - name: Atualizar registro da última verificação
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone

          path = "update_manifest.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          data["last_check"] = datetime.now(timezone.utc).isoformat()
          data["update_frequency"] = "diária"
          data["schedule_cron"] = "0 12 * * *"
          data["incremental_check"] = True

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: Publicar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add update_manifest.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para publicar."
          else
            git commit -m "chore: verificação regulatória diária"
            git push
          fi
