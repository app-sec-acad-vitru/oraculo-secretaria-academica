name: Atualização Regulatória Diária do Oráculo

on:
  schedule:
    # Todos os dias às 09:00 no horário de Brasília (12:00 UTC)
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-oraculo:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Executar monitoramento regulatório
        run: python scripts/monitor_regulatorio.py

      - name: Publicar relatório e dados do monitoramento
        run: |
          git config user.name "oraculo-bot"
          git config user.email "oraculo-bot@users.noreply.github.com"

          git add monitoring update_manifest.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração de monitoramento para publicar."
          else
            git commit -m "chore: atualização regulatória diária"
            git push
          fi
