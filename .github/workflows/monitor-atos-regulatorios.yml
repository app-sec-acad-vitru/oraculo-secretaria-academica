name: Monitoramento de Atos Regulatórios — V10.2

on:
  workflow_dispatch:
  schedule:
    # 12:30 BRT / 15:30 UTC — após a disponibilização diária do INLABS
    - cron: "30 15 * * *"

permissions:
  contents: write

concurrency:
  group: oraculo-monitor-regulatorio
  cancel-in-progress: false

jobs:
  monitorar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install --upgrade pip

      - name: Executar monitor V10.2
        env:
          INLABS_EMAIL: ${{ secrets.INLABS_EMAIL }}
          INLABS_PASSWORD: ${{ secrets.INLABS_PASSWORD }}
        run: python scripts/monitor_atos_regulatorios.py

      - name: Verificar alterações
        id: diff
        run: |
          if git diff --quiet -- monitoring/atos_regulatorios.json monitoring/atos_regulatorios_log.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit e push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitoring/atos_regulatorios.json monitoring/atos_regulatorios_log.json
          git commit -m "chore: atualizar monitoramento de atos regulatórios V10.2"
          git push
