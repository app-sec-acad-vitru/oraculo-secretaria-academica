name: Diagnóstico INLABS — V10.4 Login

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oraculo-monitor-regulatorio
  cancel-in-progress: false

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Executar V10.4
        env:
          INLABS_EMAIL: ${{ secrets.INLABS_EMAIL }}
          INLABS_PASSWORD: ${{ secrets.INLABS_PASSWORD }}
        run: python scripts/monitor_atos_regulatorios.py

      - name: Exibir diagnóstico
        run: |
          echo "===== V10.4 LOGIN INLABS ====="
          cat monitoring/atos_regulatorios_log.json

      - name: Commit do diagnóstico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitoring/atos_regulatorios_log.json
          git commit -m "chore: diagnóstico login INLABS V10.4" || echo "Sem alterações"
          git push || true
