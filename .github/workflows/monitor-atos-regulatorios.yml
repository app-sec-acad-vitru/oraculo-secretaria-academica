name: Captura Controlada INLABS — V10.5

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oraculo-monitor-regulatorio
  cancel-in-progress: false

jobs:
  captura:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Executar captura controlada
        env:
          INLABS_EMAIL: ${{ secrets.INLABS_EMAIL }}
          INLABS_PASSWORD: ${{ secrets.INLABS_PASSWORD }}
        run: python scripts/monitor_atos_regulatorios.py

      - name: Exibir diagnóstico
        run: |
          echo "===== V10.5 — CAPTURA CONTROLADA ====="
          cat monitoring/inlabs_capture_diagnostic.json

      - name: Commit do diagnóstico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitoring/inlabs_capture_diagnostic.json monitoring/atos_regulatorios_log.json
          git commit -m "chore: diagnóstico captura INLABS V10.5" || echo "Sem alterações"
          git push || true
