name: Monitoramento de Atos Regulatórios — V10

on:
  workflow_dispatch:
  schedule:
    - cron: "20 11 * * *"

permissions:
  contents: write

concurrency:
  group: oraculo-monitor-regulatorio
  cancel-in-progress: false

jobs:
  monitorar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Executar monitor de atos
        run: python scripts/monitor_atos_regulatorios.py

      - name: Verificar alterações
        id: diff
        run: |
          git status --short
          if git diff --quiet -- monitoring/atos_regulatorios.json monitoring/atos_regulatorios_log.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar registros
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitoring/atos_regulatorios.json monitoring/atos_regulatorios_log.json
          git commit -m "chore: atualização V10 de atos regulatórios" || exit 0
          git push
