name: Classificação de Atos de Curso — V10.8.1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oraculo-monitor-regulatorio-v10-8-1
  cancel-in-progress: false

jobs:
  classificar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependência HTTP
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Executar V10.8.1
        env:
          INLABS_EMAIL: ${{ secrets.INLABS_EMAIL }}
          INLABS_PASSWORD: ${{ secrets.INLABS_PASSWORD }}
        run: |
          python scripts/monitor_atos_regulatorios.py

      - name: Validar e mostrar resultado V10.8.1
        run: |
          echo "===== RESUMO V10.8.1 ====="

          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("monitoring/atos_validacao_v10_8_1.json")

          if not p.exists():
              print("ERRO: arquivo atos_validacao_v10_8_1.json não foi gerado.")
              raise SystemExit(1)

          data = json.loads(p.read_text(encoding="utf-8"))

          print(json.dumps(
              data.get("resumo", {}),
              ensure_ascii=False,
              indent=2
          ))

          print("\n===== DOWNLOADS =====")
          for d in data.get("downloads", []):
              print(
                  f"{d.get('date')} / {d.get('section')}: "
                  f"HTTP {d.get('http_status')} | "
                  f"ZIP={d.get('is_zip')} | "
                  f"{d.get('bytes')} bytes"
              )

          print("\n===== CANDIDATOS DE ATO DE CURSO =====")
          for i, item in enumerate(data.get("candidatos", []), 1):
              print(
                  f"{i}. [{item.get('tipo_ato_classificado')}] "
                  f"{item.get('titulo')}"
              )
              print(f"   Objeto: {item.get('objeto_classificado')}")
              print(
                  f"   Confiança: "
                  f"{item.get('confianca', {}).get('score')}/100"
              )
              print(
                  f"   Número/ano: "
                  f"{item.get('numero_ato')}/{item.get('ano')}"
              )
              campos = item.get("campos_extraidos", {})
              print(f"   Curso: {campos.get('curso')}")
              print(f"   Grau: {campos.get('grau')}")
              print(f"   Modalidade: {campos.get('modalidade')}")
              print(f"   e-MEC: {campos.get('codigo_emec')}")

          print("\n===== FILA DE VALIDAÇÃO =====")
          for i, item in enumerate(data.get("fila_validacao", []), 1):
              print(
                  f"{i}. [{item.get('tipo_ato_classificado')}] "
                  f"{item.get('titulo')}"
              )
              print(f"   Objeto: {item.get('objeto_classificado')}")
              print(
                  f"   Confiança: "
                  f"{item.get('confianca', {}).get('score')}/100"
              )
              print(
                  f"   Número/ano: "
                  f"{item.get('numero_ato')}/{item.get('ano')}"
              )

          print("\n===== ERROS =====")
          for erro in data.get("erros", []):
              print(json.dumps(erro, ensure_ascii=False))
          PY

      - name: Commitar resultados V10.8.1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             monitoring/atos_validacao_v10_8_1.json             monitoring/atos_validacao_v10_8_1.md

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commit."
          else
            git commit -m "monitor: V10.8.1 parser completo de atos de curso"
            git push
          fi
