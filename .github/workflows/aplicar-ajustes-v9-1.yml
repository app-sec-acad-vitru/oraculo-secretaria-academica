name: Aplicar ajustes V9.1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar-v9-1:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Executar ajustes V9.1
        run: python aplicar_ajustes_v9_1.py

      - name: Validar alterações
        run: |
          git diff --check
          echo "===== MONITOR REGULATÓRIO ====="
          git diff -- scripts/monitor_regulatorio.py
          echo "===== WORKFLOW DIÁRIO ====="
          git diff -- .github/workflows/atualizacao-regulatoria.yml
          echo "===== WORKFLOW SEMANAL ====="
          git diff -- .github/workflows/weekly-regulatory-monitor.yml
          echo "===== INDEX ====="
          git diff -- index.html

      - name: Publicar ajustes V9.1
        run: |
          git config user.name "oraculo-bot"
          git config user.email "oraculo-bot@users.noreply.github.com"

          git add \
            scripts/monitor_regulatorio.py \
            .github/workflows/atualizacao-regulatoria.yml \
            .github/workflows/weekly-regulatory-monitor.yml \
            index.html

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para publicar."
          else
            git commit -m "chore: ajustes do monitor regulatório v9.1"
            git push
          fi
